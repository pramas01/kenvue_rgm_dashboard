<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RGM Delivery — Infographic Generator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231C2B3A'/><text x='16' y='24' font-family='Georgia,serif' font-size='22' font-weight='bold' text-anchor='middle' fill='%23FFFFFF'>K</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#D1D5DB;font-family:Arial,Helvetica,sans-serif;min-height:100vh}

/* Controls */
.ctrl{position:fixed;top:0;left:0;right:0;z-index:100;background:#fff;border-bottom:1px solid #E5E7EB;padding:10px 24px;display:flex;align-items:center;gap:12px}
.ctrl-title{font-size:14px;font-weight:600;color:#111827}
.ctrl-status{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:500}
.s-loading{background:#FEF3C7;color:#92400E}
.s-live{background:#D1FAE5;color:#065F46}
.s-error{background:#FEE2E2;color:#991B1B}
.s-embedded{background:#F3F4F6;color:#374151}
.ctrl-btns{margin-left:auto;display:flex;gap:8px}
.btn{font-size:12px;font-weight:600;padding:7px 16px;border-radius:8px;border:none;cursor:pointer}
.btn-primary{background:#1C2B3A;color:#fff}
.btn-secondary{background:#fff;color:#1C2B3A;border:1px solid #DDE3EC}
.btn:disabled{opacity:.5;cursor:default}

/* Wrap */
.ig-wrap{padding:52px 20px 40px;display:flex;justify-content:center}

/* Infographic */
#ig{width:1400px;background:#fff;padding:24px 30px 18px;font-family:Arial,Helvetica,sans-serif;color:#111827}

/* Header */
.ig-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.ig-title{font-size:19px;font-weight:700;color:#0D1926;line-height:1.2}
.ig-tags{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap}
.ig-kenvue{font-size:13px;color:#9BABB8;font-weight:600;padding-top:3px}
.ig-divider{border:none;border-top:0.5px solid #E5E7EB;margin:8px 0}

/* Section */
.ig-sec{margin-bottom:4px}
.ig-sec-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#6B7280;margin-bottom:7px}
.ig-cols{display:flex;gap:20px}
.ig-col{flex:1;display:flex;flex-direction:column;gap:5px}
.ig-item{display:flex;align-items:flex-start;gap:7px;font-size:12px;line-height:1.35;color:#1F2937}
.ig-ach-dot{width:17px;height:17px;border-radius:50%;background:#166534;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.ig-atn-dot{width:9px;height:9px;border-radius:50%;background:#EF4444;flex-shrink:0;margin-top:4px}
.ig-badge{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:999px;flex-shrink:0;white-space:nowrap;margin-top:1px}

/* Overview */
.ig-ov-title{font-size:14px;font-weight:700;color:#0D1926;margin-bottom:10px}
.ig-counts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.count-box{border-radius:7px;padding:14px 8px;text-align:center}
.count-n{font-size:30px;font-weight:700;line-height:1.1}
.count-l{font-size:10.5px;font-weight:500;margin-top:3px}

/* Timeline */
.ig-tl-lbl{font-size:12px;font-weight:700;color:#1F2937;margin-bottom:5px}

/* Footer */
.ig-foot{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#9CA3AF;margin-top:2px}

/* Print */
@media print{
  @page{size:A4 landscape;margin:0}
  .ctrl{display:none!important}
  body{background:#fff}
  .ig-wrap{padding:0;background:#fff;display:block}
  #ig{width:100%;transform-origin:top left}
}
</style>
</head>
<body>

<div class="ctrl">
  <span class="ctrl-title">RGM Delivery Status — Infographic Generator</span>
  <span id="ctrl-status" class="ctrl-status s-loading">Fetching data…</span>
  <div class="ctrl-btns">
    <button class="btn btn-secondary" onclick="window.print()">&#8595; Download PDF</button>
    <button id="btn-png" class="btn btn-primary" onclick="dlPNG()">&#8595; Download PNG</button>
  </div>
</div>

<div class="ig-wrap">
  <div id="ig"><div style="padding:60px;text-align:center;color:#9CA3AF">Fetching data from GitHub…</div></div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────
const GITHUB_RAW = 'https://raw.githubusercontent.com/pramas01/kenvue_rgm_dashboard/main/rgm_program_update_June.xlsx';
const SHEET_NAMES = ['POM','TPO','PEA','US Customer PnL','Pricing'];

// ── Timeline constants ───────────────────────────────────────────────
const TL_START  = new Date(2026,0,15);   // Jan 15
const TL_END    = new Date(2026,10,15);  // Nov 15
const TL_MS     = TL_END - TL_START;
const PLOT_LEFT = 155;
const PLOT_W    = 1175;
const SVG_W     = 1340;
const TBD_X     = PLOT_LEFT + PLOT_W;   // right edge for TBD items

// ── Embedded fallback — week ending 6/5 ──────────────────────────────
const EMBEDDED_HL = {
  weekEnding: '6/5',
  achievements: [
    {prod:'PEA & TPO', text:'Commitments of $1.6 MM in CIW Benefits, due to PEA+TPO Capability, for Tesco Listerine.'},
    {prod:'POM',       text:'EMEA, APAC and NA-US reports Live in Production'},
    {prod:'PEA & TPO', text:'AUS Woolworths — PEA Live on Prod; TPO DS Optimized Model under finalization'},
  ],
  attention: [
    {prod:'POM',       text:'LATAM — PENDING business sign-off; UAT to complete by week of 16-June'},
    {prod:'POM',       text:'NA-US — Data Correctness of MyCIW; meeting next week with Tatiana'},
    {prod:'PEA & TPO', text:'CHI AS Watson — PEA Go-Live first week of July; UAT 6/22 - 6/29'},
    {prod:'POM',       text:'NA-CA — New source data pending (Ana Fuentes)'},
    {prod:'Pricing',   text:'UK — Semantic inclusion underway (Adil / Jason)'},
    {prod:'Pricing',   text:'Brazil — Datasets in discussion with local DnA; targeted end-May'},
  ],
  footer: 'Power Apps tool for Delist file ingestion · Delist governance process · FG Status corrections',
};
const EMBEDDED_ROWS_RAW = {
'POM':[['NA','Regional rollout','Live','Live','','','','Mar 2026',''],['EMEA','Regional rollout','Live','Live','','','','26 Mar 2026',''],['APAC','Regional rollout','Live','Live','','','','23 Mar 2026',''],['LATAM','Regional rollout','Pending','UAT','','','','TBD',''],['NA-CA','Regional rollout','Pending','Discovery','','','','TBD','']],
'TPO':[['CA','Shoppers Drug Mart','Live','Live','','','','May 2026',''],['DE','Rossmann','Delayed','Build & integration','','','','TBD',''],['DE','Edeka','Delayed','Build & integration','','','','TBD',''],['DE','Rewe','Delayed','Build & integration','','','','TBD',''],['AUS','Coles','Pending','Discovery','','','','TBD',''],['AUS','Woolworths','Planned','Build & integration','','','','Jul 2026',''],['UK','Boots','Planned','Build & integration','','','','Sep 2026',''],['UK','Asda','Planned','Build & integration','','','','Sep 2026',''],['UK','Tesco','In progress','Build & integration','','','','Jun 2026',''],['FR','Carrefour','Planned','Discovery','','','','Oct 2026',''],['FR','Leclerc','Planned','Discovery','','','','Oct 2026',''],['FR','Intermarche','Planned','Discovery','','','','Oct 2026',''],['BR','Droga Raia','Pending','Discovery','','','','TBD',''],['CHI','AS Watson','In progress','UAT','','','22-29 Jun 2026','Jul 2026','']],
'PEA':[['CA','Shoppers Drug Mart','Live','Live','','','','7 May 2026',''],['AUS','Woolworths','Live','Live','','','','May 2026',''],['DE','Rossmann','Delayed','Build & integration','','','','TBD',''],['DE','Edeka','Delayed','Build & integration','','','','TBD',''],['DE','Rewe','Delayed','Build & integration','','','','TBD',''],['AUS','Coles','Planned','Build & integration','','','','Jul 2026',''],['UK','Boots','Planned','Build & integration','','','','Jun 2026',''],['UK','Asda','Planned','Build & integration','','','','Jun 2026',''],['UK','Tesco','In progress','Build & integration','','','','Jun 2026',''],['FR','Carrefour','Planned','Discovery','','','','Jul 2026',''],['FR','Leclerc','Planned','Discovery','','','','Jul 2026',''],['FR','Intermarche','Planned','Discovery','','','','Jul 2026',''],['BR','Droga Raia','Pending','Discovery','','','','TBD',''],['CHI','AS Watson','In progress','UAT','','','22-29 Jun 2026','Jul 2026','']],
'US Customer PnL':[['NA','Discovery & business requirements','Live','Live','','','','6 May 2026',''],['NA','Data modelling','Live','Live','','','','6 May 2026',''],['NA','Tactical build','In progress','Build & integration','','','','Jul 2026',''],['NA','Technical go-live','Planned','UAT','','','','Sep 2026',''],['NA','Activation','Planned','Discovery','','','','Oct 2026','']],
'Pricing':[['UK','UK pricing','In progress','Discovery','','','','TBD',''],['BR','Brazil pricing datasets','In progress','Discovery','','','','TBD','']],
};
let weekEnding = EMBEDDED_HL.weekEnding;
let achievements = [...EMBEDDED_HL.achievements];
let attentionItems = [...EMBEDDED_HL.attention];
let footerText = EMBEDDED_HL.footer;
let ROWS = buildRows(EMBEDDED_ROWS_RAW);

// ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function chunkBy(arr, n) {
  const out=[];
  for(let i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n));
  return out;
}
function badgeStyle(prod) {
  const m={'POM':'background:#DBEAFE;color:#1E40AF','PEA & TPO':'background:#D1FAE5;color:#065F46',
    'US Customer PnL':'background:#EDE9FE;color:#5B21B6','Pricing':'background:#FEF3C7;color:#92400E'};
  return m[prod]||'background:#F3F4F6;color:#374151';
}
function parseDate(str) {
  if(!str||str==='TBD'||str==='—') return null;
  const M={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const Q={Q1:1,Q2:4,Q3:7,Q4:10};
  let m;
  m=str.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/);
  if(m) return new Date(+m[3],M[m[2]],+m[1]);
  m=str.match(/^([A-Za-z]+)\s+(\d{4})$/);
  if(m) return new Date(+m[2],M[m[1]],15);
  m=str.match(/^(\d+)[-–](\d+)\s+([A-Za-z]+)\s+(\d{4})$/);
  if(m) return new Date(+m[4],M[m[3]],Math.round((+m[1] + +m[2])/2));
  m=str.match(/^Q(\d)\s+(\d{4})$/);
  if(m) return new Date(+m[2],(Q['Q'+m[1]]||7),15);
  return null;
}
function getX(str, dateObj) {
  const d = dateObj || parseDate(str);
  if(!d) return TBD_X;
  const t = Math.max(0,Math.min(1,(d-TL_START)/TL_MS));
  return PLOT_LEFT + t*PLOT_W;
}
function worstStatus(arr) {
  const p=['Delayed','In progress','Pending','Planned','Live'];
  for(const s of p) if(arr.includes(s)) return s;
  return arr[0]||'Planned';
}
function buildRows(raw) {
  const rows=[];
  SHEET_NAMES.forEach(prod=>{
    (raw[prod]||[]).forEach(r=>{
      if(!r[0]&&!r[1]) return;
      rows.push({product:prod,market:String(r[0]||''),customer:String(r[1]||''),
        status:String(r[2]||'Pending'),phase:String(r[3]||''),
        disc:String(r[4]||''),build:String(r[5]||''),uat:String(r[6]||''),
        golive:String(r[7]||'TBD'),notes:String(r[8]||'')});
    });
  });
  return rows;
}

// ── SVG helpers ───────────────────────────────────────────────────────
function svgDot(x, y, status, r=7) {
  const cx = +x.toFixed(1);
  const FILL = {'Live':'#166534','In progress':'#1D4ED8','Delayed':'#B91C1C','Planned':'white','Pending':'white'};
  const STRK = {'Planned':'#9CA3AF','Pending':'#D1D5DB'};
  const fill = FILL[status]||'white';
  const strk = STRK[status]||'none';
  const sw = strk!=='none' ? ` stroke="${strk}" stroke-width="1.5"` : '';
  let s = `<circle cx="${cx}" cy="${y}" r="${r}" fill="${fill}"${sw}/>`;
  if(status==='Live'){
    // SVG polyline checkmark — no text entities, renders everywhere
    const sz=r*0.5;
    const p1=`${(cx-sz).toFixed(1)},${y}`;
    const p2=`${(cx-sz*0.15).toFixed(1)},${(y+sz*0.72).toFixed(1)}`;
    const p3=`${(cx+sz).toFixed(1)},${(y-sz*0.7).toFixed(1)}`;
    s+=`<polyline points="${p1} ${p2} ${p3}" stroke="white" stroke-width="${(r*0.28).toFixed(1)}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else if(status==='In progress'){
    // SVG polygon right-arrow
    const sz=r*0.46;
    s+=`<polygon points="${(cx-sz*0.5).toFixed(1)},${(y-sz).toFixed(1)} ${(cx+sz).toFixed(1)},${y} ${(cx-sz*0.5).toFixed(1)},${(y+sz).toFixed(1)}" fill="white"/>`;
  }
  return s;
}
function svgTxt(x, y, text, size, color, anchor='middle', weight='normal') {
  return `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" text-anchor="${anchor}" font-family="Arial,sans-serif" font-size="${size}" fill="${color}" font-weight="${weight}">${esc(text)}</text>`;
}

// Spread dots horizontally so they don't overlap
function spreadDots(dots, minGap=16) {
  if(dots.length<=1) return dots;
  const sorted=[...dots].sort((a,b)=>a.x-b.x);
  const out=[]; let i=0;
  while(i<sorted.length){
    const cluster=[sorted[i]]; let j=i+1;
    while(j<sorted.length && sorted[j].x - cluster[0].x < minGap){ cluster.push(sorted[j]); j++; }
    if(cluster.length===1){ out.push(cluster[0]); }
    else {
      const cx = cluster.reduce((s,d)=>s+d.x,0)/cluster.length;
      const totalW = (cluster.length-1)*minGap;
      cluster.forEach((d,k)=>out.push({...d, x:cx - totalW/2 + k*minGap}));
    }
    i=j;
  }
  return out;
}

// ── Render functions ──────────────────────────────────────────────────
function renderHeader() {
  return `<div class="ig-hdr">
    <div>
      <div class="ig-title">Delivery Status &mdash; Weekly Snapshot &nbsp;&middot;&nbsp; Week Ending ${esc(weekEnding)}</div>
      <div class="ig-tags">
        <span class="ig-badge" style="background:#DBEAFE;color:#1E40AF">POM</span>
        <span style="color:#D1D5DB">&middot;</span>
        <span class="ig-badge" style="background:#D1FAE5;color:#065F46">PEA &amp; TPO</span>
        <span style="color:#D1D5DB">&middot;</span>
        <span class="ig-badge" style="background:#EDE9FE;color:#5B21B6">US Customer PnL</span>
        <span style="color:#D1D5DB">&middot;</span>
        <span class="ig-badge" style="background:#FEF3C7;color:#92400E">Pricing</span>
      </div>
    </div>
    <div class="ig-kenvue">Kenvue</div>
  </div>`;
}
function renderAchievements() {
  if(!achievements.length) return '';
  const cols=chunkBy(achievements,5);
  return `<div class="ig-sec">
    <div class="ig-sec-lbl">Key Achievements</div>
    <div class="ig-cols">
      ${cols.map(col=>`<div class="ig-col">${col.map(a=>`
        <div class="ig-item"><div class="ig-ach-dot">&#10003;</div>
        ${a.prod?`<span class="ig-badge" style="${badgeStyle(a.prod)}">${esc(a.prod)}</span>`:''}
        <span>${esc(a.text)}</span></div>`).join('')}</div>`).join('')}
    </div>
  </div>`;
}
function renderAttention() {
  if(!attentionItems.length) return '';
  const cols=chunkBy(attentionItems,4);
  return `<div class="ig-sec">
    <div class="ig-sec-lbl">Key Items Needing Attention</div>
    <div class="ig-cols">
      ${cols.map(col=>`<div class="ig-col">${col.map(a=>`
        <div class="ig-item"><div class="ig-atn-dot"></div>
        ${a.prod?`<span class="ig-badge" style="${badgeStyle(a.prod)}">${esc(a.prod)}</span>`:''}
        <span>${esc(a.text)}</span></div>`).join('')}</div>`).join('')}
    </div>
  </div>`;
}
function renderOverview() {
  const live  = ROWS.filter(r=>r.status==='Live').length;
  const onTrk = ROWS.filter(r=>r.status==='In progress').length;
  const del   = ROWS.filter(r=>r.status==='Delayed').length;
  const plan  = ROWS.filter(r=>r.status==='Planned'||r.status==='Pending').length;
  const total = live+onTrk+del+plan;
  const boxes=[
    {n:live, l:'Live / Completed',bg:'#F0FDF4',nc:'#15803D',lc:'#166534'},
    {n:onTrk,l:'On Track',        bg:'#EFF6FF',nc:'#1D4ED8',lc:'#1E40AF'},
    {n:0,    l:'At Risk',         bg:'#FFFBEB',nc:'#D97706',lc:'#92400E'},
    {n:del,  l:'Delayed',         bg:'#FFF1F2',nc:'#E11D48',lc:'#BE123C'},
    {n:plan, l:'Planned',         bg:'#F9FAFB',nc:'#374151',lc:'#4B5563'},
  ];
  return `<div class="ig-sec">
    <div class="ig-ov-title">Program Delivery Overview &nbsp;&middot;&nbsp; <strong>${total}</strong> Milestones in Focus</div>
    <div class="ig-counts">${boxes.map(b=>`
      <div class="count-box" style="background:${b.bg}">
        <div class="count-n" style="color:${b.nc}">${b.n}</div>
        <div class="count-l" style="color:${b.lc}">${b.l}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderTimeline() {
  const SVG_H = 275;
  const DR = 7;

  // Row config — more vertical space for labels
  const pea_cy=119, tpo_cy=151;
  const RC=[
    {lbl:'POM',         sub:'5 regions',    cy:68},
    {lbl:'PEA & TPO',   sub:'14 customers', cy:135},
    {lbl:'US Cust. PnL',sub:'6 milestones', cy:200},
    {lbl:'Pricing',     sub:'3 markets',    cy:245},
  ];

  let s=`<svg width="${SVG_W}" height="${SVG_H}" style="overflow:visible;display:block" xmlns="http://www.w3.org/2000/svg">`;

  // Row shading
  const BANDS=[[43,90,'#F9FAFB'],[100,172,'#ffffff'],[176,224,'#F9FAFB'],[224,265,'#ffffff']];
  BANDS.forEach(([y1,y2,c])=>s+=`<rect x="${PLOT_LEFT}" y="${y1}" width="${PLOT_W}" height="${y2-y1}" fill="${c}"/>`);

  // Outer border
  s+=`<rect x="${PLOT_LEFT}" y="28" width="${PLOT_W}" height="${SVG_H-38}" fill="none" stroke="#E5E7EB" stroke-width="0.5"/>`;

  // Horizontal row separator lines
  [97, 174, 226].forEach(y=>
    s+=`<line x1="${PLOT_LEFT}" y1="${y}" x2="${PLOT_LEFT+PLOT_W}" y2="${y}" stroke="#D1D5DB" stroke-width="1"/>`
  );

  // Month gridlines + labels
  const MONTHS=[{l:'Mar',d:new Date(2026,2,1)},{l:'Apr',d:new Date(2026,3,1)},{l:'May',d:new Date(2026,4,1)},
    {l:'Jun',d:new Date(2026,5,1)},{l:'Jul',d:new Date(2026,6,1)},{l:'Aug',d:new Date(2026,7,1)},
    {l:'Sep',d:new Date(2026,8,1)},{l:'Oct',d:new Date(2026,9,1)},{l:'Nov',d:new Date(2026,10,1)}];
  MONTHS.forEach(({l,d})=>{
    const x=getX(null,d);
    s+=`<line x1="${x.toFixed(1)}" y1="28" x2="${x.toFixed(1)}" y2="${SVG_H-10}" stroke="#EAECF0" stroke-width="1"/>`;
    s+=svgTxt(x,20,l,9,'#9CA3AF');
  });

  // TBD separator
  s+=`<line x1="${TBD_X}" y1="28" x2="${TBD_X}" y2="${SVG_H-10}" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3,3"/>`;
  s+=svgTxt(TBD_X+20,20,'TBD',8.5,'#C0C4CC');

  // Today marker
  const todayX=getX(null,new Date());
  if(todayX>PLOT_LEFT&&todayX<TBD_X){
    s+=`<line x1="${todayX.toFixed(1)}" y1="24" x2="${todayX.toFixed(1)}" y2="${SVG_H-10}" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3"/>`;
    s+=svgTxt(todayX,15,'Today',8.5,'#9CA3AF','middle');
  }

  // Row labels (left side)
  RC.forEach(r=>{
    s+=svgTxt(PLOT_LEFT-8,r.cy-3,r.lbl,11,'#1F2937','end','bold');
    s+=svgTxt(PLOT_LEFT-8,r.cy+11,r.sub,8.5,'#9CA3AF','end');
  });
  // PEA / TPO sub-row markers
  s+=svgTxt(PLOT_LEFT-8,pea_cy+4,'PEA',7.5,'#6B7280','end');
  s+=svgTxt(PLOT_LEFT-8,tpo_cy+4,'TPO',7.5,'#6B7280','end');

  // ── POM ──────────────────────────────────────────────────────────────
  let pomDots = spreadDots(
    ROWS.filter(r=>r.product==='POM').map(r=>({x:getX(r.golive),y:RC[0].cy,status:r.status,lbl:r.market})),
    18
  );
  const POM_OFFSETS=[6,18,10]; // stagger 3 heights
  pomDots.forEach((d,i)=>{
    s+=svgDot(d.x,d.y,d.status,DR);
    s+=svgTxt(d.x, d.y-DR-POM_OFFSETS[i%3], d.lbl, 8.5, '#374151');
  });

  // ── PEA & TPO — group by market+month ────────────────────────────────
  function groupByMarketMonth(rows){
    const G={};
    rows.forEach(r=>{
      const d=parseDate(r.golive);
      const bkt=d?`${d.getFullYear()}-${d.getMonth()}-${r.market}`:`TBD-${r.market}`;
      if(!G[bkt]) G[bkt]={market:r.market,golive:r.golive,statuses:[],customers:[]};
      G[bkt].statuses.push(r.status);
      G[bkt].customers.push(r.customer);
    });
    return Object.values(G).map(g=>{
      const n=g.customers.length;
      const raw=g.customers[0].replace('Shoppers Drug Mart','SDM');
      const lbl=n===1?g.market+'·'+raw:g.market+' ('+n+')';
      return {x:getX(g.golive), label:lbl, status:worstStatus(g.statuses)};
    });
  }

  let peaDots = spreadDots(groupByMarketMonth(ROWS.filter(r=>r.product==='PEA')).map(g=>({...g,y:pea_cy})), 16);
  let tpoDots = spreadDots(groupByMarketMonth(ROWS.filter(r=>r.product==='TPO')).map(g=>({...g,y:tpo_cy})), 16);

  // PEA: labels staggered ABOVE (3 heights so dense clusters don't stack)
  const PEA_OFF=[7,17,27];
  peaDots.forEach((d,i)=>{
    s+=svgDot(d.x,d.y,d.status,DR-1);
    s+=svgTxt(d.x, d.y-(DR-1)-PEA_OFF[i%3], d.label, 8, '#374151');
  });

  // TPO: dots only — labels would overflow into US PnL row
  // Sub-row position makes timing clear without text
  tpoDots.forEach(d=>{
    s+=svgDot(d.x,d.y,d.status,DR-1);
  });

  // ── US Customer PnL ───────────────────────────────────────────────────
  const PNL_LABELS={'Discovery & business requirements':'Discovery','Data modelling':'Data model',
    'Tactical build':'Tactical build','Technical go-live':'Tech go-live','Activation':'Activation'};
  let pnlDots = spreadDots(
    ROWS.filter(r=>r.product==='US Customer PnL').map(r=>({x:getX(r.golive),y:RC[2].cy,status:r.status,lbl:PNL_LABELS[r.customer]||r.customer})),
    20
  );
  const PNL_OFF=[7,17];
  pnlDots.forEach((d,i)=>{
    s+=svgDot(d.x,d.y,d.status,DR);
    s+=svgTxt(d.x, d.y-DR-PNL_OFF[i%2], d.lbl, 8, '#374151');
  });

  // ── Pricing ───────────────────────────────────────────────────────────
  let priceDots = spreadDots(
    ROWS.filter(r=>r.product==='Pricing').map(r=>({x:getX(r.golive),y:RC[3].cy,status:r.status,lbl:r.market})),
    20
  );
  priceDots.forEach((d,i)=>{
    s+=svgDot(d.x,d.y,d.status,DR);
    s+=svgTxt(d.x, d.y-DR-7, d.lbl, 8.5, '#374151');
  });

  // ── Legend ────────────────────────────────────────────────────────────
  const LY=SVG_H-3;
  [{l:'Live / Completed',st:'Live',x:PLOT_LEFT},{l:'On Track',st:'In progress',x:PLOT_LEFT+148},
   {l:'Delayed',st:'Delayed',x:PLOT_LEFT+276},{l:'Planned / TBD',st:'Planned',x:PLOT_LEFT+374}]
  .forEach(({l,st,x})=>{
    s+=svgDot(x+5,LY,st,5.5);
    s+=svgTxt(x+15,LY+4,l,8.5,'#6B7280','start');
  });

  s+='</svg>';
  return `<div><div class="ig-tl-lbl">Delivery Timeline</div>${s}</div>`;
}

function renderFooter() {
  const left=footerText?`POM &mdash; Additional features upcoming: &nbsp;${esc(footerText)}`:'&nbsp;';
  return `<div class="ig-foot"><span>${left}</span><span>Company Confidential &nbsp;&middot;&nbsp; General &nbsp;&middot;&nbsp; Kenvue</span></div>`;
}

function renderIG() {
  document.getElementById('ig').innerHTML=[
    renderHeader(),
    '<hr class="ig-divider">',
    renderAchievements(),
    '<hr class="ig-divider">',
    renderAttention(),
    '<hr class="ig-divider">',
    renderOverview(),
    '<hr class="ig-divider">',
    renderTimeline(),
    '<hr class="ig-divider">',
    renderFooter(),
  ].join('');
}

// ── Fetch ─────────────────────────────────────────────────────────────
function setStatus(state) {
  const el=document.getElementById('ctrl-status');
  const m={loading:{t:'Fetching data…',c:'s-loading'},live:{t:'Live · GitHub',c:'s-live'},
    error:{t:'GitHub unavailable · Embedded data',c:'s-error'},embedded:{t:'Embedded data',c:'s-embedded'}};
  const r=m[state]||m.embedded;
  el.textContent=r.t; el.className='ctrl-status '+r.c;
}

async function fetchAndRender() {
  // Render immediately with embedded data — no blank screen
  setStatus('embedded');
  renderIG();

  // Then try GitHub in background with a 8-second timeout
  setStatus('loading');
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 8000);
    const resp = await fetch(GITHUB_RAW + '?t=' + Date.now(), {signal: controller.signal});
    clearTimeout(timer);
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const buf = await resp.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});

    // Reset state then load from file
    achievements = []; attentionItems = []; footerText = '';
    if(wb.Sheets['Highlights']){
      const hv = XLSX.utils.sheet_to_json(wb.Sheets['Highlights'],{header:1,defval:''});
      hv.slice(1).forEach(r=>{
        const type=String(r[0]||'').trim(), prod=String(r[1]||'').trim(), text=String(r[2]||'').trim();
        if(!type||!text) return;
        if(type==='Config'&&prod==='Week ending') weekEnding=text;
        else if(type==='Achievement') achievements.push({prod,text});
        else if(type==='Attention')   attentionItems.push({prod,text});
        else if(type==='Footer')      footerText+=(footerText?' · ':'')+text;
      });
    }
    const raw={};
    SHEET_NAMES.forEach(sheet=>{
      if(!wb.Sheets[sheet]) return;
      const vals=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,defval:''});
      raw[sheet]=vals.slice(1).filter(r=>r[0]||r[1]);
    });
    ROWS=buildRows(raw);
    setStatus('live');
    renderIG();
  } catch(e) {
    console.warn('GitHub fetch failed, using embedded data:', e.message);
    setStatus('error');
    // Already rendered with embedded data above — no further action needed
  }
}

// ── Download PNG ──────────────────────────────────────────────────────
async function dlPNG() {
  const btn=document.getElementById('btn-png');
  btn.disabled=true; btn.textContent='Generating…';
  try {
    const canvas=await html2canvas(document.getElementById('ig'),{
      scale:2, useCORS:true, backgroundColor:'#ffffff', logging:false,
    });
    const a=document.createElement('a');
    a.download=`RGM_Delivery_Status_${weekEnding.replace(/\//g,'-')}.png`;
    a.href=canvas.toDataURL('image/png'); a.click();
  } catch(e){ console.error(e); alert('PNG generation failed. Try the PDF download instead.'); }
  btn.disabled=false; btn.textContent='↓ Download PNG';
}

// Boot
fetchAndRender();
</script>
