<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kenvue - RGM Program Delivery Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2300B097'/><text x='16' y='24' font-family='Georgia,serif' font-size='22' font-weight='bold' text-anchor='middle' fill='white'>K</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#00B097; --teal-light:#E6F8F6; --teal-dark:#008A76;
  --black:#0A0B0D; --white:#FFFFFF;
  --bg:#F2F4F7; --surface:#FFFFFF;
  --border:#E2E5EB; --border-2:#EEF0F4;
  --text:#0A0B0D; --text-2:#5C6370; --text-3:#9EA3A9;
  --s-live:#166534; --s-live-bg:#DCFCE7; --s-live-t:#14532D;
  --s-prog:#92400E; --s-prog-bg:#FEF3C7; --s-prog-t:#78350F;
  --s-plan:#1E40AF; --s-plan-bg:#DBEAFE; --s-plan-t:#1E3A8A;
  --s-dela:#991B1B; --s-dela-bg:#FEE2E2; --s-dela-t:#7F1D1D;
  --s-pend:#374151; --s-pend-bg:#F3F4F6; --s-pend-t:#1F2937;
  --r:10px; --r-lg:14px;
}
body{font-family:"Kenvue Sans","Manrope",-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none}

/* ── Header ─────────────────────────────────────────────────────── */
.hdr{background:var(--black);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:90;gap:16px}
.hdr-left{display:flex;align-items:baseline;gap:10px}
.hdr-brand{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:var(--teal);letter-spacing:2px;text-transform:uppercase}
.hdr-title{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;color:var(--white);letter-spacing:-0.3px}
.hdr-right{display:flex;align-items:center;gap:10px}
.conn-badge{font-size:10px;font-weight:600;padding:3px 10px;border-radius:999px}
.cb-loading{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.5)}
.cb-live{background:rgba(0,176,151,0.2);color:var(--teal)}
.cb-error{background:rgba(255,100,100,0.15);color:#f87171}
.hdr-btn{font-size:11px;font-weight:600;padding:6px 14px;border-radius:7px;border:none;cursor:pointer;transition:all .15s}
.hdr-btn-ghost{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.12)}
.hdr-btn-ghost:hover{background:rgba(255,255,255,0.14);color:var(--white)}
.hdr-btn-teal{background:var(--teal);color:var(--white)}
.hdr-btn-teal:hover{background:var(--teal-dark)}

/* ── Container ─────────────────────────────────────────────────── */
.wrap{max-width:1100px;margin:0 auto;padding:28px 28px 64px}

/* ── Product cards ─────────────────────────────────────────────── */
.prod-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.prod-card{background:var(--surface);border:1.5px solid var(--border);border-left:4px solid var(--teal);border-radius:var(--r-lg);padding:22px 18px 18px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;gap:6px}
.prod-card:hover{background:var(--teal-light);border-color:var(--teal);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,176,151,0.12)}
.prod-card:hover .pc-arrow{color:var(--teal)}
.pc-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text);line-height:1.3}
.pc-desc{font-size:11px;color:var(--text-3);flex:1;line-height:1.4}
.pc-arrow{font-size:12px;font-weight:600;color:var(--border);margin-top:8px;transition:color .15s}

/* ── Achievement banner ──────────────────────────────────────────── */
.ach-banner{background:var(--black);border-radius:var(--r-lg);padding:32px 48px 24px;margin-bottom:16px;text-align:center;position:relative;overflow:hidden;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.ach-banner::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:400px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(0,176,151,0.1),transparent 65%);pointer-events:none}
#ach-inner{display:flex;flex-direction:column;align-items:center;gap:10px;transition:opacity .25s,transform .25s}
.ach-big-num{font-family:'Syne',sans-serif;font-size:58px;font-weight:800;color:var(--teal);line-height:1;letter-spacing:-1.5px}
.ach-icon-big{width:44px;height:44px;border-radius:50%;background:rgba(0,176,151,0.15);border:1.5px solid rgba(0,176,151,0.3);display:flex;align-items:center;justify-content:center;color:var(--teal);font-size:20px;font-weight:700;margin:0 auto}
.ach-big-text{font-size:13.5px;color:rgba(255,255,255,0.75);line-height:1.6;max-width:520px}
.ach-banner-badge{background:rgba(0,176,151,0.12);color:var(--teal);font-size:9.5px;font-weight:700;padding:3px 12px;border-radius:999px;border:1px solid rgba(0,176,151,0.25);display:inline-block;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ach-bdots{display:flex;gap:5px;margin-top:16px}
.ach-bdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.18);cursor:pointer;transition:all .2s}
.ach-bdot.on{background:var(--teal);width:18px;border-radius:3px}

/* ── Dual collapsible ────────────────────────────────────────────── */
.dual-coll{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;align-items:start}
@media(max-width:640px){.dual-coll{grid-template-columns:1fr}}

/* ── Collapsible tabs ────────────────────────────────────────────── */
.coll-tab-bar{display:flex;border-bottom:1px solid var(--border-2);margin:-4px -20px 14px;padding:0 20px}
.coll-tab{font-size:12px;font-weight:600;padding:8px 16px;border:none;background:none;cursor:pointer;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.coll-tab.on{color:var(--teal);border-bottom-color:var(--teal)}
.coll-tab:hover:not(.on){color:var(--text)}
.coll-pane{display:flex;flex-direction:column;gap:6px}
.coll-item{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;line-height:1.4;color:var(--text)}
.coll-item>span:last-child{flex:1;min-width:0}
.ci-dot-ach{width:18px;height:18px;border-radius:50%;background:#166534;display:flex;align-items:center;justify-content:center;color:white;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.ci-dot-atn{width:9px;height:9px;border-radius:50%;background:#EF4444;flex-shrink:0;margin-top:5px}
.ci-badge{font-size:9px;font-weight:700;padding:2px 0;border-radius:999px;flex-shrink:0;white-space:nowrap;width:72px;min-width:72px;text-align:center;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* ── Product switcher ────────────────────────────────────────────── */
.prod-switcher{display:flex;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:3px;flex-wrap:wrap}
.ps-tab{font-size:11px;font-weight:600;padding:5px 10px;border-radius:7px;border:none;background:none;color:var(--text-2);cursor:pointer;transition:all .12s;white-space:nowrap}
.ps-tab.on{background:var(--teal);color:white}
.ps-tab:not(.on):hover{background:var(--teal-light);color:var(--teal)}

/* ── Collapsible ─────────────────────────────────────────────────── */
.coll-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:24px;overflow:hidden}
.coll-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:none;border:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2);transition:background .12s}
.coll-trigger:hover{background:var(--bg)}
.coll-icon{font-size:18px;color:var(--teal);font-weight:400;transition:transform .2s}
.coll-body{padding:16px 20px 20px;border-top:1px solid var(--border-2)}
.coll-sec-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-3);margin-bottom:10px}
.coll-items{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.coll-item{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;line-height:1.4;color:var(--text)}
.ci-dot-ach{width:18px;height:18px;border-radius:50%;background:#166534;display:flex;align-items:center;justify-content:center;color:white;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.ci-dot-atn{width:9px;height:9px;border-radius:50%;background:#EF4444;flex-shrink:0;margin-top:5px}
.ci-badge{font-size:9px;font-weight:700;padding:1px 7px;border-radius:999px;flex-shrink:0;margin-top:2px}
.coll-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}

/* ── Landing timeline ────────────────────────────────────────────── */
.tl-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 24px}
.tl-section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.tl-section-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text)}
.tl-legend{display:flex;gap:14px;flex-wrap:wrap}
.tl-leg-item{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--text-2)}

/* ── Product view ────────────────────────────────────────────────── */
.pv-hdr{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--teal);background:var(--teal-light);border:none;padding:7px 14px;border-radius:var(--r);transition:background .12s}
.back-btn:hover{background:#CFF2EE}
.pv-name{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--text)}
.pv-meta{font-size:12px;color:var(--text-3);margin-left:auto;display:flex;align-items:center;gap:8px}
.view-toggle{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:3px}
.vt-btn{font-size:11px;font-weight:600;padding:5px 14px;border-radius:7px;border:none;background:none;cursor:pointer;color:var(--text-2);transition:all .15s}
.vt-btn.on{background:var(--teal);color:var(--white)}

/* ── Metrics ─────────────────────────────────────────────────────── */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.m-lbl{font-size:10px;color:var(--text-2);display:flex;align-items:center;gap:5px;margin-bottom:4px}
.m-val{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--text);line-height:1}

/* ── Zone grid ─────────────────────────────────────────────────── */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.zone{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;opacity:0;animation:fadeUp .32s ease forwards}
.zone-head{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:var(--bg);border-bottom:1px solid var(--border-2)}
.zone-code{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--text)}
.zone-name{font-size:10px;color:var(--text-3);margin-left:6px}
.zone-count{font-size:10px;color:var(--text-3)}
.zone-row{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border-2);cursor:pointer;transition:background .1s}
.zone-row:last-child{border-bottom:none}
.zone-row:hover{background:#F8FBF9}

/* Retailer logos */
.ret-logo{width:22px;height:22px;border-radius:5px;object-fit:contain;flex-shrink:0;border:1px solid var(--border-2)}
.ret-init{width:22px;height:22px;border-radius:5px;background:var(--teal);color:white;font-size:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:.5px}

.rname{flex:1;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rright{display:flex;align-items:center;gap:8px;flex-shrink:0}
.rstat{font-size:10px;color:var(--text-2)}
.rdate{font-size:11px;color:var(--text-2);min-width:70px;text-align:right}
.legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.li{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-2)}
.li-hint{margin-left:auto;font-size:11px;color:var(--text-3);font-style:italic}

/* ── Dots & pills ────────────────────────────────────────────────── */
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.d-live{background:var(--s-live)} .d-prog{background:var(--s-prog)} .d-plan{background:var(--s-plan)}
.d-dela{background:var(--s-dela)} .d-pend{background:var(--s-pend)}
.pill{font-size:10px;font-weight:600;padding:2px 9px;border-radius:999px;display:inline-block}
.pl-live{background:var(--s-live-bg);color:var(--s-live-t)} .pl-prog{background:var(--s-prog-bg);color:var(--s-prog-t)}
.pl-plan{background:var(--s-plan-bg);color:var(--s-plan-t)} .pl-dela{background:var(--s-dela-bg);color:var(--s-dela-t)}
.pl-pend{background:var(--s-pend-bg);color:var(--s-pend-t)}

/* ── What's next ─────────────────────────────────────────────────── */
.next-wrap{padding-top:4px}
.ngroup{margin-bottom:18px}
.nwhen{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;color:var(--text);margin-bottom:8px}
.nln{flex:1;height:1px;background:var(--border)}
.npast{font-size:10px;font-weight:400;color:var(--s-prog)}
.nrow{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:7px;cursor:pointer;transition:border-color .12s}
.nrow:hover{border-color:var(--teal)}
.nmain{flex:1;font-size:12.5px;color:var(--text)}
.nmkt{color:var(--text-3)}
.nnote{font-size:11px;color:var(--text-3)}
.nprod{font-size:10px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--bg);color:var(--text-2);white-space:nowrap}

/* ── Overlay ─────────────────────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(10,11,13,.6);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:64px 16px;animation:overlayIn .2s ease}
.card{background:var(--white);border-radius:var(--r-lg);width:100%;max-width:420px;padding:28px;box-shadow:0 24px 64px rgba(0,0,0,.2);animation:cardIn .24s ease}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:2px}
.card-name{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--text);line-height:1.2}
.xbtn{border:none;background:none;cursor:pointer;font-size:18px;color:var(--text-3);padding:3px 6px;border-radius:6px;transition:background .1s}
.xbtn:hover{background:var(--bg)}
.card-meta{font-size:11.5px;color:var(--text-2);margin-bottom:22px}
.tl{position:relative}
.tl-item{display:flex;gap:14px;position:relative;padding-bottom:18px}
.tl-item:last-child{padding-bottom:0}
.tl-line{position:absolute;left:6px;top:14px;bottom:0;width:1.5px;background:var(--border)}
.tl-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;margin-top:1px;z-index:1;border:2.5px solid var(--white)}
.tn-done{background:var(--s-live)} .tn-cur{background:var(--teal);box-shadow:0 0 0 3px rgba(0,176,151,.18)} .tn-todo{background:var(--bg);border:2px solid var(--border)}
.tn-dela{background:var(--s-dela);box-shadow:0 0 0 3px rgba(153,27,27,.12)}
.tl-body{flex:1;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tl-label{font-size:12.5px;color:var(--text)} .tl-label.muted{color:var(--text-3)} .tl-label.tl-delayed{color:var(--s-dela)} .tl-date{font-size:11px;color:var(--text-2);white-space:nowrap}
.card-note{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-2);line-height:1.6}
.card-callout{margin-top:14px;padding:10px 14px;background:var(--teal-light);border:1px solid rgba(0,176,151,.2);border-left:3px solid var(--teal);border-radius:var(--r);font-size:11.5px;color:var(--text);line-height:1.5}
.callout-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--teal);margin-bottom:5px}
/* ── TPx split card ────────────────────────────────────────────── */
.tpx-col-hdr{display:grid;grid-template-columns:1fr 1fr;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);padding:5px 14px;background:var(--bg);border-bottom:1px solid var(--border-2);gap:0}
.tpx-col-hdr span{padding:0 2px}
.tpx-col-hdr span:first-child{border-right:1px solid var(--border-2);padding-right:10px}
.tpx-row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border-2)}
.tpx-row:last-child{border-bottom:none}
.tpx-side{display:flex;align-items:center;gap:7px;padding:9px 14px;font-size:12px;color:var(--text);min-height:38px;transition:background .1s}
.tpx-side:first-child{border-right:1px solid var(--border-2)}
.tpx-side.clickable{cursor:pointer}
.tpx-side.clickable:hover{background:#F8FBF9}
.tpx-na{color:var(--text-3);font-size:11px}
.tpx-badge{font-size:9px;font-weight:700;padding:1px 6px;border-radius:999px;flex-shrink:0}
.region-filter{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.rf-btn{font-size:11px;font-weight:600;padding:5px 14px;border-radius:7px;border:1.5px solid var(--border);background:var(--white);color:var(--text-2);cursor:pointer;transition:all .12s}
.rf-btn.on{background:var(--teal);color:var(--white);border-color:var(--teal)}
.rf-btn:not(.on):hover{border-color:var(--teal);color:var(--teal)}

/* ── Animations ──────────────────────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ── Responsive ──────────────────────────────────────────────────── */
@media(max-width:860px){
  .prod-cards{grid-template-columns:repeat(3,1fr)}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .coll-grid{grid-template-columns:1fr}
}
@media(max-width:580px){
  .prod-cards{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:16px 16px 48px}
  .feat-number{font-size:56px}
}
</style>
</head>
<body>

<!-- ── Header ────────────────────────────────────────────────────── -->
<header class="hdr">
  <div class="hdr-left">
    <span class="hdr-brand">Kenvue</span>
    <span class="hdr-title">RGM Program Delivery Dashboard</span>
  </div>
  <div class="hdr-right">
    <span id="week-lbl" style="font-size:13px;font-weight:600;color:#FFFFFF"></span>
    <span id="conn-badge" class="conn-badge cb-loading">Loading…</span>
    <button id="refresh-btn" class="hdr-btn hdr-btn-ghost" onclick="fetchFromGitHub()" style="display:none">↺ Refresh</button>
    <button class="hdr-btn hdr-btn-teal" onclick="window.open('infographic.html','_blank')">&#128202; Infographic</button>
  </div>
</header>

<!-- ── Landing page ───────────────────────────────────────────────── -->
<div id="page-landing" class="wrap">
  <div id="landing-main">Loading…</div>
</div>

<!-- ── Product view ───────────────────────────────────────────────── -->
<div id="page-product" class="wrap" style="display:none">
  <div id="product-main"></div>
</div>

<!-- ── Drill overlay ─────────────────────────────────────────────── -->
<div id="overlay-container"></div>

<script>
// ════════════════════════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════════════════════════
const GITHUB_RAW = 'https://raw.githubusercontent.com/pramas01/kenvue_rgm_dashboard/main/rgm_program_update_June.xlsm';
const SHEET_NAMES = ['POM','TPO','PEA','US Customer PnL','Pricing'];

// ════════════════════════════════════════════════════════════════════
//  RETAILER LOGO DOMAINS

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function buildRows(raw){
  const rows=[];
  SHEET_NAMES.forEach(prod=>{
    (raw[prod]||[]).forEach(r=>{
      if(!r[0]&&!r[1])return;
      rows.push({product:prod,market:String(r[0]||''),customer:String(r[1]||''),
        status:String(r[2]||'Pending'),phase:String(r[3]||''),
        disc:String(r[4]||''),build:String(r[5]||''),uat:String(r[6]||''),
        golive:String(r[7]||'TBD'),notes:String(r[8]||''),callout:String(r[9]||'')});
    });
  });
  return rows;
}
function parseDate(str){
  if(!str||str==='TBD'||str==='—')return null;
  const M={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const Q={Q1:1,Q2:4,Q3:7,Q4:10};
  let m;
  m=str.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/);if(m)return new Date(+m[3],M[m[2]],+m[1]);
  m=str.match(/^([A-Za-z]+)\s+(\d{4})$/);if(m)return new Date(+m[2],M[m[1]],15);
  m=str.match(/^(\d+)[-–](\d+)\s+([A-Za-z]+)\s+(\d{4})$/);if(m)return new Date(+m[4],M[m[3]],Math.round((+m[1]+ +m[2])/2));
  m=str.match(/^Q(\d)\s+(\d{4})$/);if(m)return new Date(+m[2],(Q['Q'+m[1]]||7),15);
  return null;
}
function dkey(d){
  if(!d||d==='TBD')return 999999;
  const date=parseDate(d);
  if(!date)return 999999;
  return date.getFullYear()*100+date.getMonth()+1;
}

// ── Achievement banner ────────────────────────────────────────────
let _achIdx=0, _achTimer=null;
function startCarousel(){
  const all=featured?[featured,...achievements]:[...achievements];
  if(!all.length)return;
  if(_achTimer){clearInterval(_achTimer);_achTimer=null;}
  _achIdx=0;
  _showSlide(all,0);
  if(all.length>1) _achTimer=setInterval(()=>{_achIdx=(_achIdx+1)%all.length;_showSlide(all,_achIdx);},4000);
}
function _showSlide(all,i){
  const a=all[i],el=document.getElementById('ach-inner');
  if(!el)return;
  const m=a.text.match(/\$[\d.]+\s*(?:MM?|B)\b/i);
  const num=m?m[0]:null;
  const txt=num?a.text.replace(num,'').replace(/^[,\s]+/,'').replace(/[,\s]+$/,''):a.text;
  el.style.opacity='0'; el.style.transform='translateY(8px)';
  setTimeout(()=>{
    el.innerHTML=
      (num?`<div class="ach-big-num">${esc(num)}</div>`:`<div class="ach-icon-big">&#10003;</div>`)+
      `<div class="ach-big-text">${esc(txt)}</div>`+
      (a.prod?`<span class="ach-banner-badge">${esc(a.prod)}</span>`:'');
    el.style.opacity='1'; el.style.transform='translateY(0)';
  },200);
  const dd=document.getElementById('ach-dots');
  if(dd) dd.innerHTML=all.map((_,j)=>`<span class="ach-bdot${j===i?' on':''}" onclick="goSlide(${j})"></span>`).join('');
}
function goSlide(i){
  const all=featured?[featured,...achievements]:[...achievements];
  _achIdx=i; _showSlide(all,i);
  if(_achTimer){clearInterval(_achTimer);_achTimer=setInterval(()=>{_achIdx=(_achIdx+1)%all.length;_showSlide(all,_achIdx);},4000);}
}

// ── Landing timeline ──────────────────────────────────────────────
function renderLandingTimeline(){
  // Tighter left margin, wider plot, scale to Dec 31
  const S={SVG_W:1000,SVG_H:300,PL:90,PW:880,DR:6};
  S.DATE_W=S.PW-60;            // date-scale width (Mar–Dec)
  S.TBD=S.PL+S.DATE_W+38;      // TBD zone centre — inside the plot, right of Dec
  const TL_START=new Date(2026,2,1),TL_END=new Date(2026,11,31),TL_MS=TL_END-TL_START;
  function gx(str,d){const dt=d||parseDate(str);if(!dt)return S.TBD;return S.PL+Math.max(0,Math.min(1,(dt-TL_START)/TL_MS))*S.DATE_W;}
  function dot(x,y,st,r){
    const F={'Live':'#166534','In progress':'#1D4ED8','Delayed':'#B91C1C','Planned':'#D1D5DB','Pending':'#D1D5DB'};
    const fill=F[st]||'#D1D5DB';
    const cx=+x.toFixed(1);
    let s=`<circle cx="${cx}" cy="${y}" r="${r}" fill="${fill}"/>`;
    if(st==='Live'){const z=r*.5;s+=`<polyline points="${(cx-z).toFixed(1)},${y} ${(cx-z*.15).toFixed(1)},${(y+z*.72).toFixed(1)} ${(cx+z).toFixed(1)},${(y-z*.7).toFixed(1)}" stroke="white" stroke-width="${(r*.28).toFixed(1)}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;}
    else if(st==='In progress'){const z=r*.46;s+=`<polygon points="${(cx-z*.5).toFixed(1)},${(y-z).toFixed(1)} ${(cx+z).toFixed(1)},${y} ${(cx-z*.5).toFixed(1)},${(y+z).toFixed(1)}" fill="white"/>`;}
    return s;
  }
  function lbl(x,y,t,sz,c,anchor='middle'){return `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" text-anchor="${anchor}" font-family="Manrope,sans-serif" font-size="${sz}" fill="${c}">${esc(t)}</text>`;}
  function spread(dots,gap=18){
    const XMAX=S.PL+S.PW-12; // hard right boundary inside plot
    if(dots.length<=1)return dots.map(d=>({...d,x:Math.min(d.x,XMAX)}));
    const s=[...dots].sort((a,b)=>a.x-b.x),out=[];let i=0;
    while(i<s.length){const cl=[s[i]];let j=i+1;while(j<s.length&&s[j].x-cl[0].x<gap){cl.push(s[j]);j++;}
      if(cl.length===1){out.push({...cl[0],x:Math.min(cl[0].x,XMAX)});}
      else{
        let cx=cl.reduce((a,d)=>a+d.x,0)/cl.length;
        const tw=(cl.length-1)*gap;
        // shift cluster left if it would overflow right boundary
        if(cx+tw/2>XMAX) cx=XMAX-tw/2;
        cl.forEach((d,k)=>out.push({...d,x:cx-tw/2+k*gap}));
      }
      i=j;}
    return out;
  }
  function grpMktMo(rows){
    const G={};
    rows.forEach(r=>{const d=parseDate(r.golive),bkt=d?`${d.getFullYear()}-${d.getMonth()}-${r.market}`:`TBD-${r.market}`;
      if(!G[bkt])G[bkt]={market:r.market,golive:r.golive,sts:[]};G[bkt].sts.push(r.status);});
    return Object.values(G).map(g=>({x:gx(g.golive),lbl:g.market,status:['Delayed','In progress','Pending','Planned','Live'].find(s=>g.sts.includes(s))||'Planned'}));
  }

  const RC=[{lbl:'POM',sub:'5 regions',cy:62},{lbl:'PEA & TPO',sub:'14 customers',cy:130},{lbl:'US Cust. PnL',sub:'6 milestones',cy:200},{lbl:'Pricing',sub:'3 markets',cy:248}];
  const pea_cy=115,tpo_cy=148;
  let svg=`<svg viewBox="0 0 ${S.SVG_W} ${S.SVG_H}" style="display:block;width:100%" xmlns="http://www.w3.org/2000/svg">`;

  // Bands
  [[38,92,'#FAFBFC'],[92,170,'#fff'],[170,226,'#FAFBFC'],[226,268,'#fff']].forEach(([y1,y2,c])=>svg+=`<rect x="${S.PL}" y="${y1}" width="${S.PW}" height="${y2-y1}" fill="${c}"/>`);
  svg+=`<rect x="${S.PL}" y="26" width="${S.PW}" height="242" fill="none" stroke="#E2E5EB" stroke-width="0.5"/>`;
  [92,170,226].forEach(y=>svg+=`<line x1="${S.PL}" y1="${y}" x2="${S.PL+S.PW}" y2="${y}" stroke="#D4D8DF" stroke-width="1"/>`);

  // Month labels + gridlines — Mar through Dec
  [{l:'Mar',d:new Date(2026,2,1)},{l:'Apr',d:new Date(2026,3,1)},{l:'May',d:new Date(2026,4,1)},{l:'Jun',d:new Date(2026,5,1)},{l:'Jul',d:new Date(2026,6,1)},{l:'Aug',d:new Date(2026,7,1)},{l:'Sep',d:new Date(2026,8,1)},{l:'Oct',d:new Date(2026,9,1)},{l:'Nov',d:new Date(2026,10,1)},{l:'Dec',d:new Date(2026,11,1)}]
  .forEach(({l,d})=>{const x=gx(null,d);svg+=`<line x1="${x.toFixed(1)}" y1="26" x2="${x.toFixed(1)}" y2="268" stroke="#EAECF0" stroke-width="1"/>`;svg+=lbl(x,18,l,9,'#9EA3A9');});

  // TBD zone — separator after Dec, inside the plot
  const tbdSep=S.PL+S.DATE_W+8;
  svg+=`<line x1="${tbdSep}" y1="26" x2="${tbdSep}" y2="268" stroke="#D4D8DF" stroke-width="1" stroke-dasharray="3,3"/>`;
  svg+=lbl(S.TBD,18,'TBD',8,'#C8CBD0');

  // Today
  const todayX=gx(null,new Date());
  if(todayX>S.PL&&todayX<S.PL+S.PW){svg+=`<line x1="${todayX.toFixed(1)}" y1="22" x2="${todayX.toFixed(1)}" y2="268" stroke="#9EA3A9" stroke-width="1.5" stroke-dasharray="4,3"/>`;svg+=lbl(todayX,14,'Today',8,'#9EA3A9');}

  // Row labels — tight against left edge
  RC.forEach(r=>{
    svg+=lbl(S.PL-6,r.cy-3,r.lbl,10,'#0A0B0D','end');
    svg+=lbl(S.PL-6,r.cy+10,r.sub,7.5,'#9EA3A9','end');
  });
  svg+=lbl(S.PL-6,pea_cy+4,'PEA',7,'#9EA3A9','end');
  svg+=lbl(S.PL-6,tpo_cy+4,'TPO',7,'#9EA3A9','end');

  // ── POM — labels above, staggered ──
  let pomDots=spread(ROWS.filter(r=>r.product==='POM').map(r=>({x:gx(r.golive),y:RC[0].cy,status:r.status,lbl:r.market})),18);
  pomDots.forEach((d,i)=>{svg+=dot(d.x,d.y,d.status,S.DR);svg+=lbl(d.x,d.y-S.DR-([5,14,9][i%3]),d.lbl,7.5,'#5C6370');});

  // ── PEA — labels above, staggered ──
  let peaDots=spread(grpMktMo(ROWS.filter(r=>r.product==='PEA')).map(g=>({...g,y:pea_cy})),18);
  peaDots.forEach((d,i)=>{svg+=dot(d.x,d.y,d.status,S.DR-1);svg+=lbl(d.x,d.y-(S.DR-1)-([5,13,21][i%3]),d.lbl,7,'#5C6370');});

  // ── TPO — labels BELOW dots so they don't clash with PEA ──
  let tpoDots=spread(grpMktMo(ROWS.filter(r=>r.product==='TPO')).map(g=>({...g,y:tpo_cy})),18);
  tpoDots.forEach((d,i)=>{svg+=dot(d.x,d.y,d.status,S.DR-1);svg+=lbl(d.x,d.y+(S.DR-1)+([10,18][i%2]),d.lbl,7,'#5C6370');});

  // ── US PnL — labels above, staggered ──
  const PNL_S={'Discovery & business requirements':'Discovery','Data modelling':'Data model','Tactical build':'Tactical','Technical go-live':'Tech go-live','Activation':'Activation'};
  let pnlDots=spread(ROWS.filter(r=>r.product==='US Customer PnL').map(r=>({x:gx(r.golive),y:RC[2].cy,status:r.status,lbl:PNL_S[r.customer]||r.customer})),20);
  pnlDots.forEach((d,i)=>{svg+=dot(d.x,d.y,d.status,S.DR);svg+=lbl(d.x,d.y-S.DR-([5,14][i%2]),d.lbl,7,'#5C6370');});

  // ── Pricing — labels above ──
  let pDots=spread(ROWS.filter(r=>r.product==='Pricing').map(r=>({x:gx(r.golive),y:RC[3].cy,status:r.status,lbl:r.market})),20);
  pDots.forEach(d=>{svg+=dot(d.x,d.y,d.status,S.DR);svg+=lbl(d.x,d.y-S.DR-5,d.lbl,7.5,'#5C6370');});

  // ── Legend ──
  const LY=S.SVG_H-14;
  [{l:'Live',st:'Live'},{l:'On Track',st:'In progress'},{l:'Delayed',st:'Delayed'},{l:'Planned / TBD',st:'Planned'}]
  .forEach(({l,st},i)=>{const lx=S.PL+i*120;svg+=dot(lx+4,LY,st,5);svg+=lbl(lx+14,LY+4,l,8.5,'#9EA3A9','start');});

  svg+='</svg>';
  return `<div class="coll-wrap" style="margin-bottom:0">
    <button class="coll-trigger" onclick="toggleColl(this)">
      <span>Delivery Timeline</span>
      <span class="coll-icon">+</span>
    </button>
    <div class="coll-body" hidden style="padding:12px 16px 16px">
      ${svg}
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════════════════════
//  PRODUCT VIEW
// ════════════════════════════════════════════════════════════════════
function showProduct(i){
  curProd=i; curView='board'; curRegion=null;
  document.getElementById('page-landing').style.display='none';
  document.getElementById('page-product').style.display='block';
  renderProductView();
  window.scrollTo(0,0);
}
function showLanding(){
  document.getElementById('page-landing').style.display='block';
  document.getElementById('page-product').style.display='none';
  renderLanding();
  window.scrollTo(0,0);
}

function renderProductView(){
  const nav=NAV_ITEMS[curProd];
  const isTpx=(nav==='TPx');

  // Data lists
  const peaList=ROWS.filter(r=>r.product==='PEA');
  const tpoList=ROWS.filter(r=>r.product==='TPO');
  const allList=isTpx?[...peaList,...tpoList]:ROWS.filter(r=>r.product===nav);
  const rMkts=curRegion?REGION_MAP[curRegion]:null;
  const list=rMkts?allList.filter(r=>rMkts.includes(r.market)):allList;

  // Metrics
  let metrics;
  if(isTpx){
    const pL=rMkts?peaList.filter(r=>rMkts.includes(r.market)):peaList;
    const tL=rMkts?tpoList.filter(r=>rMkts.includes(r.market)):tpoList;
    metrics=`<div class="metrics" style="grid-template-columns:repeat(4,1fr)">
      <div class="metric"><div class="m-lbl"><span class="dot d-live"></span>PEA Live</div><div class="m-val">${pL.filter(r=>r.status==='Live').length}</div></div>
      <div class="metric"><div class="m-lbl"><span class="dot d-live"></span>TPO Live</div><div class="m-val">${tL.filter(r=>r.status==='Live').length}</div></div>
      <div class="metric"><div class="m-lbl"><span class="dot d-prog"></span>In Progress</div><div class="m-val">${list.filter(r=>r.status==='In progress').length}</div></div>
      <div class="metric"><div class="m-lbl"><span class="dot d-dela"></span>Delayed</div><div class="m-val">${list.filter(r=>r.status==='Delayed').length}</div></div>
    </div>`;
  } else {
    const cnt={'Live':0,'In progress':0,'Delayed':0,'Planned':0,'Pending':0};
    allList.forEach(r=>cnt[r.status]++);
    metrics=`<div class="metrics">
      <div class="metric"><div class="m-lbl"><span class="dot d-live"></span>Live</div><div class="m-val">${cnt.Live}</div></div>
      <div class="metric"><div class="m-lbl"><span class="dot d-prog"></span>In progress</div><div class="m-val">${cnt['In progress']}</div></div>
      <div class="metric"><div class="m-lbl"><span class="dot d-dela"></span>Delayed</div><div class="m-val">${cnt.Delayed}</div></div>
      <div class="metric"><div class="m-lbl"><span class="dot d-plan"></span>Planned</div><div class="m-val">${cnt.Planned}</div></div>
    </div>`;
  }

  const rfBar=`<div class="region-filter">
    <button class="rf-btn${!curRegion?' on':''}" onclick="setRegion(null)">All</button>
    <button class="rf-btn${curRegion==='NA'?' on':''}" onclick="setRegion('NA')">NA</button>
    <button class="rf-btn${curRegion==='EMEA'?' on':''}" onclick="setRegion('EMEA')">EMEA</button>
    <button class="rf-btn${curRegion==='APAC'?' on':''}" onclick="setRegion('APAC')">APAC</button>
    <button class="rf-btn${curRegion==='LATAM'?' on':''}" onclick="setRegion('LATAM')">LATAM</button>
  </div>`;

  let content='';
  if(curView==='board'){
    if(isTpx){
      // Build market → {pea:{cust→row}, tpo:{cust→row}}
      const byMkt={};
      const addRow=(r,prog)=>{
        if(rMkts&&!rMkts.includes(r.market)) return;
        if(!byMkt[r.market]) byMkt[r.market]={pea:{},tpo:{}};
        byMkt[r.market][prog][r.customer]=r;
      };
      peaList.forEach(r=>addRow(r,'pea'));
      tpoList.forEach(r=>addRow(r,'tpo'));

      if(Object.keys(byMkt).length===0){
        content=`<div style="text-align:center;padding:48px 0;color:var(--text-3);font-size:13px">No deliveries in the ${curRegion} region for TPx</div>`;
      } else {
        let zones='<div class="zones">'; let delay=0;
        Object.entries(byMkt).forEach(([mk,data])=>{
          const custs=[...new Set([...Object.keys(data.pea),...Object.keys(data.tpo)])];
          zones+=`<div class="zone" style="animation-delay:${delay}ms">
            <div class="zone-head"><span><span class="zone-code">${mk}</span>${MKT[mk]?`<span class="zone-name">${MKT[mk]}</span>`:''}</span><span class="zone-count">${custs.length} retailers</span></div>
            <div class="tpx-col-hdr"><span>PEA — Post Event Analytics</span><span>TPO — Trade Promo Optimisation</span></div>`;
          custs.forEach(cust=>{
            const pR=data.pea[cust], tR=data.tpo[cust];
            const pgi=pR?ROWS.indexOf(pR):-1, tgi=tR?ROWS.indexOf(tR):-1;
            const pS=pR?(ST[pR.status]||ST['Pending']):null;
            const tS=tR?(ST[tR.status]||ST['Pending']):null;
            zones+=`<div class="tpx-row">
              <div class="tpx-side${pR?' clickable':''}" ${pR?`onclick="drill(${pgi})"`:''}>${logoEl(cust)}<span class="rname">${esc(cust)}</span>${pR?`<span class="rright"><span class="dot ${pS.dc}"></span><span class="rstat">${pS.label}</span><span class="rdate">${esc(pR.golive)}</span></span>`:'<span class="tpx-na">—</span>'}</div>
              <div class="tpx-side${tR?' clickable':''}" ${tR?`onclick="drill(${tgi})"`:''}>${tR?`<span class="rright"><span class="dot ${tS.dc}"></span><span class="rstat">${tS.label}</span><span class="rdate">${esc(tR.golive)}</span></span>`:'<span class="tpx-na">—</span>'}</div>
            </div>`;
          });
          zones+='</div>'; delay+=55;
        });
        zones+='</div>';
        content=zones+`<div class="legend"><span class="li"><span class="dot d-live"></span>Live</span><span class="li"><span class="dot d-prog"></span>In progress</span><span class="li"><span class="dot d-dela"></span>Delayed</span><span class="li"><span class="dot d-plan"></span>Planned</span><span class="li"><span class="dot d-pend"></span>Pending</span><span class="li-hint">Click either side to see phase timeline</span></div>`;
      }
    } else {
      const byM={};list.forEach(r=>{(byM[r.market]=byM[r.market]||[]).push(r);});
      if(Object.keys(byM).length===0){
        content=`<div style="text-align:center;padding:48px 0;color:var(--text-3);font-size:13px">No deliveries in the ${curRegion} region for ${nav}</div>`;
      } else {
        let zones='<div class="zones">'; let delay=0;
        Object.entries(byM).forEach(([mk,items])=>{
          zones+=`<div class="zone" style="animation-delay:${delay}ms"><div class="zone-head"><span><span class="zone-code">${mk}</span>${MKT[mk]?`<span class="zone-name">${MKT[mk]}</span>`:''}</span><span class="zone-count">${items.length} ${items.length>1?'items':'item'}</span></div>`;
          items.forEach(r=>{const s=ST[r.status]||ST['Pending'],gi=ROWS.indexOf(r);
            zones+=`<div class="zone-row" onclick="drill(${gi})">${logoEl(r.customer)}<span class="rname">${esc(r.customer)}</span><span class="rright"><span class="dot ${s.dc}"></span><span class="rstat">${s.label}</span><span class="rdate">${esc(r.golive)}</span></span></div>`;
          });
          zones+='</div>'; delay+=55;
        });
        zones+='</div>';
        content=zones+`<div class="legend"><span class="li"><span class="dot d-live"></span>Live</span><span class="li"><span class="dot d-prog"></span>In progress</span><span class="li"><span class="dot d-dela"></span>Delayed</span><span class="li"><span class="dot d-plan"></span>Planned</span><span class="li"><span class="dot d-pend"></span>Pending</span><span class="li-hint">Click any row for its go-live timeline</span></div>`;
      }
    }
  } else {
    const ev=list.filter(r=>r.status!=='Live').map(r=>({...r,k:dkey(r.golive),gi:ROWS.indexOf(r)})).sort((a,b)=>a.k-b.k);
    const groups={},order=[];
    ev.forEach(e=>{const key=e.golive||'TBD';if(!groups[key]){groups[key]=[];order.push(key);}groups[key].push(e);});
    const NOW=202606;
    let html='<div class="next-wrap">';
    if(ev.length===0) html+=`<div style="text-align:center;padding:40px 0;color:var(--text-3)">All items are Live</div>`;
    order.forEach(when=>{
      const k=dkey(when),past=(k<NOW&&k!==999999),lbl=when==='TBD'?'Unscheduled (TBD)':when;
      html+=`<div class="ngroup"><div class="nwhen">${lbl}${past?' <span class="npast">· date passed</span>':''}<span class="nln"></span></div>`;
      groups[when].forEach(e=>{const s=ST[e.status]||ST['Pending'];
        html+=`<div class="nrow" onclick="drill(${e.gi})"><span class="dot ${s.dc}"></span><span class="nmain">${esc(e.customer)} <span class="nmkt">· ${e.market}</span></span><span class="nnote">${s.label}</span><span class="nprod">${isTpx?e.product:nav}</span></div>`;
      });
      html+='</div>';
    });
    content=html+'</div>';
  }

  const switcher=`<div class="prod-switcher">${NAV_ITEMS.map((p,i)=>`<button class="ps-tab${i===curProd?' on':''}" onclick="showProduct(${i})">${p.replace('US Customer PnL','US PnL')}</button>`).join('')}</div>`;

  document.getElementById('product-main').innerHTML=`
    <div class="pv-hdr">
      <button class="back-btn" onclick="showLanding()">&#8592; Home</button>
      ${switcher}
      <div style="margin-left:auto">
        <div class="view-toggle">
          <button class="vt-btn${curView==='board'?' on':''}" onclick="setView('board')">By market</button>
          <button class="vt-btn${curView==='next'?' on':''}" onclick="setView('next')">What's next</button>
        </div>
      </div>
    </div>
    <div class="pv-name" style="margin-bottom:16px">${nav}${isTpx?` <span style="font-size:13px;font-weight:400;color:var(--text-3);font-family:Manrope,sans-serif">Trade Promo Excellence</span>`:''}</div>
    ${metrics}
    ${rfBar}
    ${content}`;
}

function setView(v){curView=v;renderProductView();}
function setRegion(r){curRegion=(curRegion===r?null:r);renderProductView();}

// ════════════════════════════════════════════════════════════════════
//  DRILL-DOWN
// ════════════════════════════════════════════════════════════════════
function drill(gi){
  const r=ROWS[gi],s=ST[r.status]||ST['Pending'];
  const phaseLabels=PHASE_LABELS_MAP[r.product]||PHASE_LABELS_MAP['US Customer PnL'];
  const phaseIdx=PHASE_IDX_MAP[r.product]||PHASE_IDX_MAP['US Customer PnL'];
  const stage=phaseIdx[r.phase]!==undefined?phaseIdx[r.phase]:0;
  const dates=phaseLabels.map((_,i)=>[r.disc,r.build,r.uat,r.golive,r.golive][i]||'');
  const STATUS_DOT={'Live':'tn-done','In progress':'tn-cur','Delayed':'tn-dela','Planned':'tn-todo','Pending':'tn-todo'};
  let tl='';
  phaseLabels.forEach((ph,i)=>{
    const state=i<stage?'done':i===stage?'cur':'todo';
    const ncls=state==='done'?'tn-done':state==='cur'?(STATUS_DOT[r.status]||'tn-cur'):'tn-todo';
    const isDelayedCur=state==='cur'&&r.status==='Delayed';
    const lcls=state==='todo'?'tl-label muted':isDelayedCur?'tl-label tl-delayed':'tl-label';
    const dt=dates[i]||(state==='todo'?'—':'');
    const last=i===phaseLabels.length-1;
    tl+=`<div class="tl-item">${last?'':`<div class="tl-line"></div>`}<div class="tl-dot ${ncls}"></div><div class="tl-body"><span class="${lcls}">${ph}</span><span class="tl-date">${dt}</span></div></div>`;
  });
  const mktFull=MKT[r.market]?` · ${MKT[r.market]}`:'';
  const callout=r.callout?`<div class="card-callout"><div class="callout-lbl">&#9888; Note</div>${esc(r.callout)}</div>`:'';
  const note=r.notes?`<div class="card-note">${esc(r.notes)}</div>`:'';
  const ov=document.createElement('div');
  ov.className='overlay';ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.innerHTML=`<div class="card"><div class="card-top"><span class="card-name">${esc(r.customer)}</span><button class="xbtn" aria-label="Close" onclick="this.closest('.overlay').remove()">&#x2715;</button></div><div class="card-meta">${esc(r.product)} · ${esc(r.market)}${esc(mktFull)} &nbsp;·&nbsp; <span class="pill ${s.pill}">${s.label}</span></div><div class="tl">${tl}</div>${callout}${note}</div>`;
  document.getElementById('overlay-container').appendChild(ov);
}

// ════════════════════════════════════════════════════════════════════
//  FETCH FROM GITHUB
// ════════════════════════════════════════════════════════════════════
function setStatus(state){
  const el=document.getElementById('conn-badge');
  const rb=document.getElementById('refresh-btn');
  const m={loading:{t:'Loading…',c:'cb-loading'},live:{t:'Live · GitHub',c:'cb-live'},error:{t:'Embedded data',c:'cb-error'}};
  const r=m[state]||m.loading;
  el.textContent=r.t;el.className='conn-badge '+r.c;
  rb.style.display=state==='live'?'inline-block':'none';
}

async function fetchFromGitHub(){
  setStatus('loading');
  try{
    const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),8000);
    const resp=await fetch(GITHUB_RAW+'?t='+Date.now(),{signal:ctrl.signal});
    clearTimeout(timer);
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const buf=await resp.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});

    // Reset highlights
    featured=null; achievements=[]; attentionItems=[];
    let footerText='';
    if(wb.Sheets['Highlights']){
      const hv=XLSX.utils.sheet_to_json(wb.Sheets['Highlights'],{header:1,defval:''});
      hv.slice(1).forEach(r=>{
        const type=String(r[0]||'').trim(),prod=String(r[1]||'').trim(),text=String(r[2]||'').trim();
        if(!type||!text)return;
        if(type==='Config'&&prod==='Week ending') weekEnding=text;
        else if(type==='Feature') featured={prod,text};
        else if(type==='Achievement') achievements.push({prod,text});
        else if(type==='Attention') attentionItems.push({prod,text});
        else if(type==='Footer') footerText+=(footerText?' · ':'')+text;
      });
      if(!featured&&achievements.length) {featured=achievements.shift();}
    }

    // Delivery data
    const raw={};
    SHEET_NAMES.forEach(sheet=>{
      if(!wb.Sheets[sheet])return;
      const vals=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,defval:''});
      raw[sheet]=vals.slice(1).filter(r=>r[0]||r[1]);
    });
    ROWS=buildRows(raw);
    setStatus('live');
  }catch(e){
    console.warn('GitHub fetch failed:',e.message);
    setStatus('error');
    featured=EMBEDDED_HL.featured;
    achievements=[...EMBEDDED_HL.achievements];
    attentionItems=[...EMBEDDED_HL.attention];
  }
  document.getElementById('week-lbl').textContent='Week ending '+weekEnding;
  if(document.getElementById('page-landing').style.display!=='none') renderLanding();
  else renderProductView();
}

// ── Boot ─────────────────────────────────────────────────────────────
document.getElementById('week-lbl').textContent='Week ending '+weekEnding;
renderLanding();
fetchFromGitHub();
</script>
